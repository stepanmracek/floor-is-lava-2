[package]
name = "floor-is-lava-3d"
version = "0.1.0"
edition = "2024"

[dependencies]
floor-is-lava-lib = { path = "../floor-is-lava-lib" }
floor-is-lava-policy = { path = "../floor-is-lava-policy" }
